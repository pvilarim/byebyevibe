# Automated PR review — GitHub Actions
# Change: add-automated-pr-review-pipeline (issue #349)
# Event: pull_request only (opened, reopened, synchronize, ready_for_review).
# Deterministic checks are blocking; LLM findings are advisory.
name: Automated PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: automated-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENSPEC_TELEMETRY: "0"

jobs:
  deterministic:
    name: Deterministic checks
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      status: ${{ steps.check.outputs.status }}
      security_sensitive: ${{ steps.check.outputs.security_sensitive }}
      blocking: ${{ steps.check.outputs.blocking }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base revision
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"

      - name: Load trusted review lenses from the base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trusted/.claude/skills/correctness-review"
          mkdir -p "$RUNNER_TEMP/trusted/.claude/skills/simplify-review"
          mkdir -p "$RUNNER_TEMP/trusted/.claude/agents"
          # Exact base-revision bodies — a PR cannot weaken its own reviewer.
          git show "${BASE_SHA}:.claude/skills/correctness-review/SKILL.md" \
            > "$RUNNER_TEMP/trusted/.claude/skills/correctness-review/SKILL.md"
          git show "${BASE_SHA}:.claude/skills/simplify-review/SKILL.md" \
            > "$RUNNER_TEMP/trusted/.claude/skills/simplify-review/SKILL.md"
          git show "${BASE_SHA}:.claude/agents/security-reviewer.md" \
            > "$RUNNER_TEMP/trusted/.claude/agents/security-reviewer.md"
          sha256sum \
            "$RUNNER_TEMP/trusted/.claude/skills/correctness-review/SKILL.md" \
            "$RUNNER_TEMP/trusted/.claude/skills/simplify-review/SKILL.md" \
            "$RUNNER_TEMP/trusted/.claude/agents/security-reviewer.md"

      - name: Run deterministic PR checks
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr-review"
          set +e
          bash scripts/pr-review-check.sh \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --policy-dir "$RUNNER_TEMP/trusted" \
            --output "$RUNNER_TEMP/pr-review" \
            --github-output "$GITHUB_OUTPUT" \
            --json > "$RUNNER_TEMP/pr-review/stdout.json"
          rc=$?
          set -e
          cp "$RUNNER_TEMP/pr-review/result.json" "${{ github.workspace }}/.pr-review-deterministic.json"
          echo "result_path=.pr-review-deterministic.json" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Write deterministic summary
        if: always()
        run: |
          if [[ -f .pr-review-deterministic.json ]]; then
            cat .pr-review-deterministic.json >> "$GITHUB_STEP_SUMMARY"
          fi
