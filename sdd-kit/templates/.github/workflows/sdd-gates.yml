# SDD Gates — enforcement fail-closed dos gates SDD no servidor (gap G1 + G8).
# Orquestra comandos existentes no repo; excepção G8: OSV-Scanner action pinada por SHA.
# Origem: openspec/changes/add-sdd-ci-gates-workflow/ (design D1–D11).
# Distribuído via sdd-kit/templates/.github/workflows/sdd-gates.yml (C1).
name: SDD Gates

on:
  push:
    branches: [main, master]
  pull_request:

# D11 — menor escopo de token (regra 050); sem secrets no workflow.
permissions:
  contents: read

env:
  OPENSPEC_TELEMETRY: "0"  # Disable CLI telemetry — PostHog

jobs:
  sdd-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # D5 — paridade com a stack declarada em openspec/project.md.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      # D2/D6 — gate normativo central, bloqueante (fail-closed).
      # Versão pinada = min_openspec de sdd-kit/MANIFEST.yaml.
      - name: OpenSpec validate (blocking)
        timeout-minutes: 3
        run: npx --yes @fission-ai/openspec@1.3.1 validate --all --strict --no-interactive

      # D3 — gate estrutural bloqueante: paths de `Pattern:` nos changes activos.
      # Script agora esperado em todos os perfis (MANIFEST 1.9.0+); exit semantics
      # profile-aware ficam dentro do próprio script (fail-closed DOCS_SPECS, report-only APP).
      - name: Task patterns (blocking)
        timeout-minutes: 3
        run: |
          if [[ -f scripts/verify-task-patterns.sh ]]; then
            bash scripts/verify-task-patterns.sh
          else
            echo "SKIP: scripts/verify-task-patterns.sh not found — reinstall via sdd-kit (bash sdd-kit/install.sh)"
          fi

      # G8 — OSV-Scanner bloqueante quando lockfile na raiz (fail-closed).
      - name: OSV-Scanner (skip — no lockfile)
        if: >-
          hashFiles('package-lock.json', 'pnpm-lock.yaml', 'yarn.lock',
                    'poetry.lock', 'Pipfile.lock', 'Cargo.lock', 'go.sum',
                    'Gemfile.lock', 'composer.lock') == ''
        run: |
          echo "SKIP: no lockfile at repo root — OSV-Scanner not applicable"

      - name: OSV-Scanner (blocking)
        if: >-
          hashFiles('package-lock.json', 'pnpm-lock.yaml', 'yarn.lock',
                    'poetry.lock', 'Pipfile.lock', 'Cargo.lock', 'go.sum',
                    'Gemfile.lock', 'composer.lock') != ''
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --recursive
            ./

      # add-release-readiness-gate (issue #348) — repo-state checks (version-sync,
      # kit-integrity, hub scripts<->templates parity) promoted to blocking, split
      # out from verify-infra.sh's environment-dependent CLI-presence checks below.
      - name: Release readiness (blocking)
        timeout-minutes: 3
        run: bash scripts/verify-release-readiness.sh

      # fix-install-python-boundary (design D7) — greenfield C1 smoke test.
      # Every other gate runs against the hub, which already carries
      # .github/workflows/ — exactly why a defect fatal to every genuine
      # greenfield install (realpath on a missing parent) survived undetected.
      # The target is an empty repo under runner.temp: not the hub checkout,
      # not pre-seeded with .github/.
      - name: Greenfield install smoke test (blocking)
        timeout-minutes: 3
        run: |
          set -euo pipefail
          T="${{ runner.temp }}/greenfield"
          rm -rf "$T"; mkdir -p "$T"
          cp -R sdd-kit "$T/"
          mkdir -p "$T/scripts"
          cp scripts/bootstrap-sdd.sh scripts/preflight-sdd.sh "$T/scripts/"
          cd "$T"
          git init -q .
          bash sdd-kit/install.sh --profile DOCS_SPECS
          # Exit code alone did not catch the realpath defect — assert files:
          test -f .github/workflows/sdd-gates.yml   # the exact path that aborted pre-fix
          count=$(find . -type f -not -path "./.git/*" -not -path "./sdd-kit/*" | wc -l)
          echo "greenfield files installed: $count"
          test "$count" -ge 20

      # fix-consumer-install (design D7) — consumer install smoke test.
      # The greenfield step above proves an empty target survives; this one proves the
      # payload a real adopter receives is complete and self-consistent.
      #
      # DELIBERATELY NOT PROVISIONED: gitnexus and graphify. Do NOT "fix" this job by
      # adding them. verify-infra.sh is advisory by design — without a TTY and without
      # --write it exits 0 regardless of its internal FAILs — so installing the knowledge
      # CLIs would add the job's entire flake surface (npm/onnxruntime, uv, grammar
      # builds) and change no assertion here.
      # What assertion (2) genuinely covers is verify.sh's own blocking checks: the
      # workflow-template check, the consumer language-policy check (blocking since
      # 1.15.0), and release readiness. Never pre-seed artifacts to make a check pass.
      - name: Consumer install smoke test (blocking)
        timeout-minutes: 6
        run: |
          set -euo pipefail

          # Enumerates every destination the MANIFEST promises for a profile and asserts
          # each one exists. Derived at run time — a hardcoded count goes stale on the
          # next entry added, and "enumerated 0" is a failure, never a pass.
          cat > "${{ runner.temp }}/assert_entries.py" <<'PY'
          import os, re, sys
          manifest, profile = sys.argv[1], sys.argv[2]
          text = open(manifest).read()
          entries, block = [], None
          for line in text.splitlines():
              if line.strip().startswith("- path:"):
                  if block and "path" in block:
                      entries.append(block)
                  block = {"path": line.split(":", 1)[1].strip()}
              elif block is not None:
                  m = re.match(r"\s+(\w+):\s*(.+)", line)
                  if m:
                      k, v = m.group(1), m.group(2).strip().strip('"')
                      if k == "profiles":
                          block["profiles"] = re.findall(r"\w+", v)
                      elif k in ("source", "merge", "path"):
                          block[k] = v
          if block and "path" in block:
              entries.append(block)
          wanted = [e["path"] for e in entries
                    if profile in e.get("profiles", ["APP", "DOCS_SPECS", "HYBRID"])]
          if not wanted:
              raise SystemExit("FAIL: enumerated 0 %s-profile entries — this check verified nothing" % profile)
          missing = [p for p in wanted if not os.path.exists(p)]
          if missing:
              raise SystemExit("FAIL: %d of %d %s-profile destinations missing:\n  %s"
                               % (len(missing), len(wanted), profile, "\n  ".join(missing)))
          print("OK: all %d %s-profile MANIFEST destinations present" % (len(wanted), profile))
          PY

          KIT="$GITHUB_WORKSPACE/sdd-kit"
          ASSERT="${{ runner.temp }}/assert_entries.py"

          # --- Variation A: canonical consumer (tarball layout — whole sdd-kit/ in the repo)
          A="${{ runner.temp }}/consumer-a"
          rm -rf "$A"; mkdir -p "$A"
          cp -R sdd-kit "$A/"
          cd "$A"
          git init -q .
          git -c user.email=ci@example.com -c user.name=CI commit -q --allow-empty -m "initial commit"
          bash sdd-kit/install.sh --profile APP --chat-lang en --docs-lang en --code-lang en

          echo "--- A1: every APP-profile MANIFEST destination applied"
          python3 "$ASSERT" sdd-kit/MANIFEST.yaml APP

          echo "--- A2: sdd-kit/verify.sh exit 0"
          bash sdd-kit/verify.sh

          echo "--- A3: openspec validate --all --strict exit 0"
          npx --yes @fission-ai/openspec@1.3.1 validate --all --strict --no-interactive

          echo "--- A4: openspec/project.md carries the materialized language policy"
          grep -q '^## Language policy' openspec/project.md
          grep -q '<!-- SDD_LANGUAGE_POLICY_START -->' openspec/project.md
          grep -q '<!-- SDD_LANGUAGE_POLICY_END -->' openspec/project.md

          # --- Variation B: hub-mode consumer (no kit in the target; installed from the
          # checkout). No verify.sh here: a hub-mode consumer has no local kit to run it
          # with until the single-acquisition-path work lands.
          B="${{ runner.temp }}/consumer-b"
          rm -rf "$B"; mkdir -p "$B"
          git -C "$B" init -q .
          git -C "$B" -c user.email=ci@example.com -c user.name=CI commit -q --allow-empty -m "initial commit"
          bash "$KIT/install.sh" --repo "$B" --profile APP --chat-lang en --docs-lang en --code-lang en
          cd "$B"

          echo "--- B1: hub-mode install applied every APP-profile destination"
          python3 "$ASSERT" "$KIT/MANIFEST.yaml" APP

          echo "--- B2: hub-mode openspec/project.md carries the language policy"
          grep -q '^## Language policy' openspec/project.md
          grep -q '<!-- SDD_LANGUAGE_POLICY_START -->' openspec/project.md
          grep -q '<!-- SDD_LANGUAGE_POLICY_END -->' openspec/project.md

      # C2 upgrade smoke test. install.sh had a greenfield gate and a consumer gate;
      # upgrade.sh had neither, which is why a `realpath` call that aborts on any
      # destination whose parent does not exist yet survived in it long after the same
      # defect was fixed in install.sh. Regressing one directory is enough to reproduce
      # the real case: every pre-1.15.0 install lacks openspec/changes/_template/specs/.
      - name: Upgrade smoke test (blocking)
        timeout-minutes: 4
        run: |
          set -euo pipefail
          VER=$(grep -E '^version:' sdd-kit/MANIFEST.yaml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          U="${{ runner.temp }}/upgrade"
          rm -rf "$U"; mkdir -p "$U"
          cp -R sdd-kit "$U/"
          cd "$U"
          git init -q .
          git -c user.email=ci@example.com -c user.name=CI commit -q --allow-empty -m "initial commit"
          git checkout -q -b work    # --apply refuses the default branch without --force
          bash sdd-kit/install.sh --profile APP --chat-lang en --docs-lang en --code-lang en >/dev/null

          # Regress to the pre-1.15.0 shape: this directory is what --apply must recreate.
          rm -rf openspec/changes/_template/specs

          bash sdd-kit/upgrade.sh --from 1.0.0 --to "$VER" --profile APP --dry-run >/dev/null
          RPT="openspec/changes/upgrade-sdd-v${VER}/UPGRADE_REPORT.md"
          sed 's/- \[ \] Upgrade approved/- [x] Upgrade approved/' "$RPT" > "$RPT.tmp"
          mv "$RPT.tmp" "$RPT"
          bash sdd-kit/upgrade.sh --from 1.0.0 --to "$VER" --profile APP --apply

          # Exit code alone is not enough — assert the path that used to abort.
          test -f openspec/changes/_template/specs/example-capability/spec.md
          echo "OK: upgrade recreated a destination whose parent did not exist"

      # D4 — report-only: verify.sh orquestra verify-infra.sh, que marca FAIL
      # para CLIs de conhecimento (GitNexus/Graphify) ausentes no runner e muta
      # openspec/infra.md. O resultado é reportado sem bloquear o merge; a
      # política fail-closed aplica-se aos passos bloqueantes acima.
      - name: sdd-kit verify (report-only)
        continue-on-error: true
        run: bash sdd-kit/verify.sh

      - name: Restore infra.md mutated by verify-infra.sh
        if: always()
        run: git checkout -- openspec/infra.md 2>/dev/null || true  # No-op if untracked (new install) — runner is ephemeral
